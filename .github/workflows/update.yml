name: Dnevno azuriranje subvencija

on:
  schedule:
    - cron: '30 6 * * *'  # Ово је 08:30 по нашем времену (UTC+1/+2)
  workflow_dispatch:      # Ово омогућава дугме за ручно покретање на клик!

jobs:
  azuriraj:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Preuzmi kod sa repozitorijuma
        uses: actions/checkout@v4

      - name: Postavi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instaliraj biblioteke
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pokreni skriptu za pretrazivanje
        run: python scraper.py

      - name: Sacuvaj promene na GitHub-u
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add podaci.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatsko azuriranje konkursa i subvencija" && git push)
